# Шинэ хувилбарын шошго (жишээ нь v1.0.0) push хийхэд тест ажиллуулаад
# Windows-ийн Nuutslagch.exe-г автоматаар бүтээж Releases хэсэгт нийтэлнэ.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build Windows exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o Nuutslagch.exe .
      - name: Checksum
        run: sha256sum Nuutslagch.exe > Nuutslagch.exe.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Nuutslagch.exe
            Nuutslagch.exe.sha256
